<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Users Nova</title>
    <style>
        /* RESET & BLOQUEO ABSOLUTO DE SELECCIÓN Y BORDES AZULES */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            user-select: none !important;
            -webkit-user-select: none !important;
            -moz-user-select: none !important;
            -ms-user-select: none !important;
            -webkit-touch-callout: none !important;
            -webkit-tap-highlight-color: transparent !important; /* Elimina el recuadro/destello azul en móviles */
            outline: none !important;
        }

        body {
            background-color: #0c020b;
            color: #fff;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
            overflow: hidden;
            position: relative;
        }

        /* LIENZO DE PARTÍCULAS */
        #particlesCanvas {
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            z-index: 0;
            pointer-events: none;
        }

        /* CONTENEDOR PRINCIPAL */
        .container {
            position: relative;
            z-index: 10;
            width: 100%;
            max-width: 400px;
            background: rgba(20, 5, 20, 0.90);
            border: 2px solid #ff007f;
            border-radius: 20px;
            padding: 30px 25px;
            box-shadow: 0 0 30px rgba(255, 0, 127, 0.45);
            text-align: center;
            backdrop-filter: blur(12px);
            animation: fadeIn 0.4s ease-out;
        }

        .title-main {
            color: #ff66cc;
            font-size: 28px;
            font-weight: 800;
            text-transform: uppercase;
            letter-spacing: 3px;
            margin-bottom: 5px;
            text-shadow: 0 0 10px #ff007f, 0 0 20px #ff007f;
        }

        .subtitle-login {
            color: #ff99dd;
            font-size: 13px;
            letter-spacing: 2px;
            margin-bottom: 25px;
            text-transform: uppercase;
        }

        /* ESTILOS DE LOGIN */
        .input-group {
            margin-bottom: 20px;
            text-align: left;
        }

        .input-group label {
            display: block;
            font-size: 12px;
            color: #ff99dd;
            margin-bottom: 8px;
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        .input-field {
            width: 100%;
            padding: 14px 16px;
            background: rgba(40, 10, 35, 0.7);
            border: 1.5px solid #ff007f;
            border-radius: 12px;
            color: #ffffff;
            font-size: 15px;
            transition: all 0.3s ease;
            box-shadow: inset 0 0 8px rgba(255, 0, 127, 0.2);
            accent-color: #ff007f;
        }

        .input-field:focus {
            border-color: #ff66cc;
            box-shadow: 0 0 15px rgba(255, 0, 127, 0.6), inset 0 0 10px rgba(255, 0, 127, 0.3);
        }

        /* BOTONES */
        .btn-action {
            width: 100%;
            background: linear-gradient(45deg, #ff007f, #b30059);
            color: #fff;
            border: none;
            padding: 14px;
            border-radius: 12px;
            font-size: 16px;
            font-weight: bold;
            letter-spacing: 1.5px;
            cursor: pointer;
            text-transform: uppercase;
            box-shadow: 0 0 15px rgba(255, 0, 127, 0.5);
            transition: transform 0.2s, box-shadow 0.2s;
        }

        .btn-action:active {
            transform: scale(0.97);
        }

        /* ZONA DE CARGA REGEDIT */
        .upload-box {
            border: 2px dashed #ff007f;
            border-radius: 14px;
            padding: 22px 15px;
            background: rgba(255, 0, 127, 0.05);
            cursor: pointer;
            transition: all 0.3s ease;
            margin-bottom: 20px;
        }

        .upload-box:hover {
            background: rgba(255, 0, 127, 0.15);
            box-shadow: 0 0 15px rgba(255, 0, 127, 0.3);
        }

        .upload-box p {
            color: #ffc2eb;
            font-size: 14px;
            margin-bottom: 12px;
        }

        .upload-btn-text {
            background: #ff007f;
            color: white;
            padding: 8px 18px;
            border-radius: 8px;
            display: inline-block;
            font-weight: bold;
            font-size: 13px;
            box-shadow: 0 0 10px rgba(255, 0, 127, 0.4);
        }

        input[type="file"] {
            display: none;
        }

        /* BARRA DE PROGRESO */
        .progress-container {
            display: none;
            margin-top: 15px;
        }

        .progress-bar-bg {
            width: 100%;
            height: 12px;
            background: #2b0c26;
            border-radius: 10px;
            overflow: hidden;
            border: 1px solid #ff007f;
        }

        .progress-bar-fill {
            width: 0%;
            height: 100%;
            background: linear-gradient(90deg, #ff007f, #ff66cc);
            box-shadow: 0 0 12px #ff007f;
            transition: width 0.08s linear;
        }

        .status-text {
            margin-top: 10px;
            font-size: 13px;
            color: #ff99dd;
            font-weight: bold;
        }

        /* PANEL DE OPCIONES */
        .options-panel {
            display: none;
            margin-top: 25px;
            animation: fadeIn 0.4s ease-in-out;
        }

        .option-card {
            background: rgba(40, 10, 35, 0.8);
            border: 1px solid #ff007f;
            border-radius: 12px;
            padding: 12px 16px;
            margin-bottom: 12px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .option-title {
            font-weight: bold;
            color: #ffffff;
            font-size: 14px;
        }

        /* SWITCH TOGGLE SIN RESALTE AZUL */
        .switch {
            position: relative;
            display: inline-block;
            width: 46px;
            height: 24px;
            cursor: pointer;
        }

        .switch input {
            opacity: 0;
            width: 0;
            height: 0;
        }

        .slider {
            position: absolute;
            top: 0; left: 0; right: 0; bottom: 0;
            background-color: #3a1532;
            transition: .3s;
            border-radius: 24px;
            border: 1.5px solid #ff007f;
        }

        .slider:before {
            position: absolute;
            content: "";
            height: 16px;
            width: 16px;
            left: 3px;
            bottom: 2.5px;
            background-color: #ffffff;
            transition: .3s;
            border-radius: 50%;
            box-shadow: 0 0 5px rgba(255, 255, 255, 0.8);
        }

        input:checked + .slider {
            background-color: #ff007f;
            box-shadow: 0 0 12px #ff007f;
        }

        input:checked + .slider:before {
            transform: translateX(21px);
        }

        /* NOTIFICACIÓN PERSONALIZADA ROSADA NEÓN */
        .custom-toast {
            position: fixed;
            top: -100px;
            left: 50%;
            transform: translateX(-50%);
            z-index: 100;
            background: rgba(30, 5, 25, 0.95);
            border: 2px solid #ff007f;
            color: #ffffff;
            padding: 14px 25px;
            border-radius: 12px;
            box-shadow: 0 0 20px rgba(255, 0, 127, 0.6);
            font-size: 14px;
            font-weight: bold;
            transition: top 0.4s ease;
            backdrop-filter: blur(8px);
            text-align: center;
            max-width: 90%;
        }

        .custom-toast.show {
            top: 25px;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(12px); }
            to { opacity: 1; transform: translateY(0); }
        }
    </style>
</head>
<body>

    <!-- CANVAS DE PARTÍCULAS ANIMADAS ROSADAS -->
    <canvas id="particlesCanvas"></canvas>

    <!-- NOTIFICACIÓN NEÓN -->
    <div id="toast" class="custom-toast">Notificación Users Nova</div>

    <!-- PANTALLA 1: LOGIN DE ACCESO -->
    <div class="container" id="loginCard">
        <div class="title-main">USER NOVA</div>
        <div class="subtitle-login">LOGIN DE ACCESO</div>

        <div class="input-group">
            <label for="usernameInput">Usuario Registrado</label>
            <input type="text" id="usernameInput" class="input-field" placeholder="Ingresa usuario..." autocomplete="off">
        </div>

        <button class="btn-action" onclick="validateLogin()">ENTRAR</button>
    </div>

    <!-- PANTALLA 2: PANEL DE ACTIVACIÓN -->
    <div class="container" id="mainCard" style="display: none;">
        <div class="title-main">USERS NOVA</div>
        <div class="subtitle-login" style="color:#00ffcc; margin-bottom:15px;">PANEL ACTIVO</div>

        <!-- Carga Regedit -->
        <div class="upload-box" onclick="document.getElementById('fileInput').click()">
            <p id="uploadPrompt">Toca para subir tus códigos optimizadores</p>
            <div class="upload-btn-text">Seleccionar Regedit</div>
            <input type="file" id="fileInput" accept=".txt" onchange="handleFile(this.files[0])">
        </div>

        <!-- Barra de Progreso -->
        <div class="progress-container" id="progressContainer">
            <div class="progress-bar-bg">
                <div class="progress-bar-fill" id="progressBar"></div>
            </div>
            <div class="status-text" id="statusText">Cargando códigos... 0%</div>
        </div>

        <!-- Opciones del Panel -->
        <div class="options-panel" id="optionsPanel">
            <div class="option-card">
                <span class="option-title">1. Asimtrick</span>
                <label class="switch">
                    <input type="checkbox" id="opt1">
                    <span class="slider"></span>
                </label>
            </div>

            <div class="option-card">
                <span class="option-title">2. Regedit</span>
                <label class="switch">
                    <input type="checkbox" id="opt2">
                    <span class="slider"></span>
                </label>
            </div>

            <div class="option-card">
                <span class="option-title">3. Estabilizador</span>
                <label class="switch">
                    <input type="checkbox" id="opt3">
                    <span class="slider"></span>
                </label>
            </div>

            <button class="btn-action" style="margin-top: 15px;" onclick="launchGame()">ABRIR JOGO</button>
        </div>
    </div>

    <script>
        // ==========================================
        // SISTEMA DE PARTÍCULAS ROSADAS NEÓN
        // ==========================================
        const canvas = document.getElementById('particlesCanvas');
        const ctx = canvas.getContext('2d');
        let particles = [];

        function resizeCanvas() {
            canvas.width = window.innerWidth;
            canvas.height = window.innerHeight;
        }
        window.addEventListener('resize', resizeCanvas);
        resizeCanvas();

        class Particle {
            constructor() {
                this.x = Math.random() * canvas.width;
                this.y = Math.random() * canvas.height;
                this.size = Math.random() * 2.8 + 0.6;
                this.speedX = (Math.random() - 0.5) * 0.7;
                this.speedY = (Math.random() - 0.5) * 0.7;
                this.opacity = Math.random() * 0.8 + 0.2;
            }

            update() {
                this.x += this.speedX;
                this.y += this.speedY;

                if (this.x < 0 || this.x > canvas.width) this.speedX *= -1;
                if (this.y < 0 || this.y > canvas.height) this.speedY *= -1;
            }

            draw() {
                ctx.fillStyle = `rgba(255, 0, 127, ${this.opacity})`;
                ctx.shadowBlur = 12;
                ctx.shadowColor = "#ff007f";
                ctx.beginPath();
                ctx.arc(this.x, this.y, this.size, 0, Math.PI * 2);
                ctx.fill();
            }
        }

        function initParticles() {
            particles = [];
            const count = Math.floor((canvas.width * canvas.height) / 8500);
            for (let i = 0; i < count; i++) {
                particles.push(new Particle());
            }
        }

        function animateParticles() {
            ctx.clearRect(0, 0, canvas.width, canvas.height);
            particles.forEach(p => {
                p.update();
                p.draw();
            });
            requestAnimationFrame(animateParticles);
        }

        initParticles();
        animateParticles();

        // ==========================================
        // NOTIFICACIÓN PERSONALIZADA ROSADA NEÓN
        // ==========================================
        function showNotification(msg, color = '#ff007f') {
            const toast = document.getElementById('toast');
            toast.innerText = msg;
            toast.style.borderColor = color;
            toast.style.boxShadow = `0 0 20px ${color}`;
            toast.classList.add('show');

            setTimeout(() => {
                toast.classList.remove('show');
            }, 3000);
        }

        // ==========================================
        // VALIDACIÓN DE LOGIN (@Novacheats)
        // ==========================================
        function validateLogin() {
            const userVal = document.getElementById('usernameInput').value.trim();

            if (userVal === "@Novacheats") {
                showNotification("Acceso Concedido. Bienvenido!", "#00ffcc");
                document.getElementById('loginCard').style.display = 'none';
                document.getElementById('mainCard').style.display = 'block';
            } else {
                showNotification("Usuario incorrecto. Intenta de nuevo.", "#ff0055");
            }
        }

        document.getElementById('usernameInput').addEventListener('keypress', function(e) {
            if (e.key === 'Enter') validateLogin();
        });

        // ==========================================
        // CARGA DE REGEDIT (.TXT) Y BARRA DE PROGRESO
        // ==========================================
        function handleFile(file) {
            if (!file) return;

            if (!file.name.endsWith('.txt')) {
                showNotification("Por favor selecciona un archivo Regedit .txt válido.", "#ff0055");
                return;
            }

            const reader = new FileReader();

            reader.onloadstart = function() {
                document.getElementById('progressContainer').style.display = 'block';
                document.getElementById('uploadPrompt').innerText = "Archivo: " + file.name;
            };

            reader.onload = function() {
                let progress = 0;
                const progressBar = document.getElementById('progressBar');
                const statusText = document.getElementById('statusText');

                const interval = setInterval(() => {
                    progress += 4;
                    progressBar.style.width = progress + '%';
                    statusText.innerText = `Cargando códigos... ${progress}%`;

                    if (progress >= 100) {
                        clearInterval(interval);
                        statusText.innerText = 'Subidos correctamente';
                        statusText.style.color = '#00ffcc';

                        setTimeout(() => {
                            document.getElementById('optionsPanel').style.display = 'block';
                        }, 400);
                    }
                }, 40);
            };

            reader.readAsText(file);
        }

        // ==========================================
        // EJECUTOR DE FREE FIRE NORMAL EN ANDROID
        // ==========================================
        function launchGame() {
            const ffPackage = "com.dts.freefireth";
            const intentUrl = `intent://#Intent;package=${ffPackage};scheme=android-app;end;`;

            window.location.href = intentUrl;

            setTimeout(() => {
                window.location.href = `https://play.google.com/store/apps/details?id=${ffPackage}`;
            }, 1500);
        }

        // ==========================================
        // PROTECCIÓN ANTI-COPIA / ANTI-INSPECT
        // ==========================================

        const blockedEvents = ['contextmenu', 'copy', 'cut', 'paste', 'selectstart', 'dragstart'];
        blockedEvents.forEach(evt => {
            document.addEventListener(evt, e => e.preventDefault());
        });

        document.onkeydown = function(e) {
            if (e.keyCode == 123 || 
               (e.ctrlKey && e.shiftKey && (e.keyCode == 73 || e.keyCode == 74 || e.keyCode == 67)) || 
               (e.ctrlKey && e.keyCode == 85) || 
               (e.ctrlKey && e.keyCode == 83)) {
                return false;
            }
        };

        setInterval(function() {
            const start = performance.now();
            debugger;
            const end = performance.now();
            if (end - start > 100) {
                document.body.innerHTML = "<h2 style='color:#ff007f; text-align:center; margin-top:30vh;'>Acceso Restringido</h2>";
            }
        }, 800);
    </script>
</body>
</html>
